<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t d"><title id="t">Featured project archive</title><desc id="d">Five verified projects by Akira.</desc><defs><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#163638"/></pattern><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.p{animation:p 3s ease-in-out infinite}@keyframes p{50%{opacity:.3}}@media(prefers-reduced-motion:reduce){.p{animation:none}}</style></defs><rect width="1200" height="640" rx="14" fill="#080f10"/><rect width="1200" height="640" rx="14" fill="url(#g)" opacity=".28"/><rect x="1.5" y="1.5" width="1197" height="637" rx="13" fill="none" stroke="#3a494b" stroke-width="3"/><text x="30" y="38" fill="#849495" font-size="13">ls -la ~/projects/featured // SELECT A REPOSITORY BELOW</text><g transform="translate(30 66)"><g><rect width="555" height="155" rx="9" fill="#101c1d" stroke="#00dbe7"/><circle cx="28" cy="30" r="7" fill="#34fc0d" class="p"/><text x="48" y="36" fill="#00dbe7" font-size="21" font-weight="700">CineVote</text><text x="24" y="72" fill="#b9cacb" font-size="14">Movie polling + screening tickets for college events.</text><text x="24" y="99" fill="#b9cacb" font-size="14">Live results, organizer controls, QR-coded passes.</text><text x="24" y="132" fill="#849495" font-size="12">NEXT.JS · TYPESCRIPT · SUPABASE · POSTGRESQL</text></g><g transform="translate(585)"><rect width="555" height="155" rx="9" fill="#101c1d" stroke="#b600f8"/><circle cx="28" cy="30" r="7" fill="#34fc0d" class="p"/><text x="48" y="36" fill="#ebb2ff" font-size="21" font-weight="700">Malayalam Summarizer</text><text x="24" y="72" fill="#b9cacb" font-size="14">Extractive summarization using multilingual embeddings,</text><text x="24" y="99" fill="#b9cacb" font-size="14">trained classifiers, and redundancy-aware selection.</text><text x="24" y="132" fill="#849495" font-size="12">PYTHON · FASTAPI · PYTORCH · REACT · VITE</text></g><g transform="translate(0 180)"><rect width="555" height="155" rx="9" fill="#101c1d" stroke="#34fc0d"/><circle cx="28" cy="30" r="7" fill="#34fc0d" class="p"/><text x="48" y="36" fill="#79ff5b" font-size="21" font-weight="700">Haajar</text><text x="24" y="72" fill="#b9cacb" font-size="14">QR group attendance with roles, multi-group support,</text><text x="24" y="99" fill="#b9cacb" font-size="14">notifications, and offline-sync fallback.</text><text x="24" y="132" fill="#849495" font-size="12">REACT NATIVE · EXPO · TYPESCRIPT · SUPABASE</text></g><g transform="translate(585 180)"><rect width="555" height="155" rx="9" fill="#101c1d" stroke="#00dbe7"/><circle cx="28" cy="30" r="7" fill="#34fc0d" class="p"/><text x="48" y="36" fill="#00dbe7" font-size="21" font-weight="700">Project Rocky</text><text x="24" y="72" fill="#b9cacb" font-size="14">Offline voice-activated Linux desktop assistant with</text><text x="24" y="99" fill="#b9cacb" font-size="14">local speech, memory, and application launching.</text><text x="24" y="132" fill="#849495" font-size="12">PYTHON · SHELL · LOCAL LLM · SPEECH · LINUX</text></g><g transform="translate(0 360)"><rect width="1140" height="155" rx="9" fill="#101c1d" stroke="#b600f8"/><circle cx="28" cy="30" r="7" fill="#34fc0d" class="p"/><text x="48" y="36" fill="#ebb2ff" font-size="21" font-weight="700">Linux Face Unlock · HP / GDM / Howdy</text><text x="24" y="76" fill="#b9cacb" font-size="14">A safety-minded Ubuntu/GDM setup guide with password fallback.</text><text x="24" y="116" fill="#849495" font-size="12">SHELL · LINUX · GDM</text><text x="1105" y="116" text-anchor="end" fill="#34fc0d" font-size="12">ARCHIVE STATUS: VERIFIED</text></g></g></svg>
