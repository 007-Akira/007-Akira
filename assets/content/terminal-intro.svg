<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" role="img" aria-labelledby="t d"><title id="t">Akira terminal introduction</title><desc id="d">Terminal commands identifying Adithya Kiran and his current status.</desc><defs><pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#163638"/></pattern><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.c{animation:b 1.1s steps(1) infinite}.s{animation:s 6s linear infinite}@keyframes b{50%{opacity:0}}@keyframes s{to{stroke-dashoffset:-80}}@media(prefers-reduced-motion:reduce){.c,.s{animation:none}}</style></defs><rect width="1200" height="230" rx="14" fill="#080f10"/><rect width="1200" height="230" rx="14" fill="url(#g)" opacity=".4"/><rect x="1.5" y="1.5" width="1197" height="227" rx="13" fill="none" stroke="#00dbe7" stroke-opacity=".65" stroke-width="3"/><circle cx="25" cy="24" r="6" fill="#ff5f57"/><circle cx="47" cy="24" r="6" fill="#febc2e"/><circle cx="69" cy="24" r="6" fill="#28c840"/><text x="92" y="29" fill="#849495" font-size="13">identity-terminal — bash — 120×30</text><path d="M18 45h1164" stroke="#253638"/><text x="30" y="82" fill="#34fc0d" font-size="16">akira@tkm:~$</text><text x="178" y="82" fill="#e1fdff" font-size="16">whoami</text><text x="30" y="112" fill="#00dbe7" font-size="18">Adithya Kiran — AI Developer &amp; Full-Stack Explorer</text><text x="30" y="151" fill="#34fc0d" font-size="16">akira@tkm:~$</text><text x="178" y="151" fill="#e1fdff" font-size="16">status --verbose</text><text x="30" y="181" fill="#b9cacb" font-size="16">Building intelligent systems, learning continuously, exploring open source.</text><path d="M30 205h700" stroke="#b600f8" stroke-width="2" stroke-dasharray="5 9" class="s"/><rect x="746" y="190" width="11" height="19" fill="#00dbe7" class="c"/></svg>
