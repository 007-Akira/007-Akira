  <circle cx="76" cy="72" r="2.5" fill="#ffd166" class="p"/><circle cx="184" cy="78" r="2" fill="#ff5a00" class="p"/>
  <circle cx="130" cy="108" r="38" fill="#0d1515" stroke="url(#fire)" stroke-width="2"/>
